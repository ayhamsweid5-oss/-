services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: makhzani
      POSTGRES_USER: makhzani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://makhzani:${POSTGRES_PASSWORD}@db:5432/makhzani
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - db
    ports:
      - "3000:3000"
volumes:
  postgres_data:
